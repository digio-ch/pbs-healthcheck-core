monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                formatter: monolog.formatter.line
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            errors:
              type: stream
              path: "%kernel.logs_dir%/%kernel.environment%.errors.log"
              level: error
              max_files: 3  # keep only the last 3 days
              formatter: 'monolog.formatter.line'
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            graylog:
                type: service
                id: App\Service\Logger\GraylogHandler
                channels: [ "!event", "!console" ]

when@test:
    monolog:
        handlers:
            main:
                # buffers all log records and only flushes them if an error occurs
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [ 404, 405 ]
                channels: [ "!event" ]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            graylog:
                type: service
                id: App\Service\Logger\GraylogHandler
                channels: ["!event", "!deprecation"]
            main:
                # buffers log records and only flushes them if an error occurs
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                # limit to 50 messages to prevent memory leaks
                buffer_size: 50
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: [ "!event", "!doctrine" ]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
