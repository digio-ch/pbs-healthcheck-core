monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
    handlers:
        main:
            type: stream
            path: php://stdout
            level: '%env(LOG_LEVEL)%'
            formatter: App\Service\Logger\Formatter
            channels: [ "!event", "!request", "!doctrine", "!console" ]
        console:
            type: console
            process_psr_3_messages: false
            channels: [ "!event", "!doctrine" ]

when@dev:
    monolog:
        handlers:
            doctrine:
                type: stream
                path: php://stdout
                level: warning
                formatter: App\Service\Logger\Formatter
                channels: [ "doctrine" ]
            deprecation:
                type: stream
                path: php://stderr
                formatter: App\Service\Logger\Formatter
                channels: [ deprecation ]
